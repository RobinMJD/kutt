name: Fork release

on:
  push:
    branches: [main]
    tags: ['v*-sr94.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    if: github.repository == 'RobinMJD/kutt'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build exact source
        run: docker build -t kutt-tested .
      - name: Isolated regression tests
        run: docker run --rm --network none --entrypoint node kutt-tested tests/container-smoke.cjs
      - name: Authenticate to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag kutt-tested "ghcr.io/robinmjd/kutt:${VERSION}"
          docker push "ghcr.io/robinmjd/kutt:${VERSION}"
