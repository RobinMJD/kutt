name: Fork release

on:
  push:
    branches: [main]
    tags: ['v*-sr94.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-publish:
    if: github.repository == 'RobinMJD/kutt'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact source
        run: docker build -t kutt-tested .
      - name: Validate example deployment configuration
        run: python3 tests/compose-config.py
      - name: Isolated regression tests
        run: docker run --rm --network none --entrypoint node kutt-tested tests/container-smoke.cjs
      - name: Isolated Redis visit-worker and restart regression
        run: sh tests/redis-smoke.sh kutt-tested
      - name: Asymmetric OIDC login and logout regression
        run: docker run --rm --network none --entrypoint node kutt-tested tests/oidc-algorithms.cjs
      - name: Unicode search on real MySQL and PostgreSQL
        run: |
          sh tests/search-database.sh kutt-tested mysql2
          sh tests/search-database.sh kutt-tested pg
      - name: Verified database and Redis TLS
        run: |
          sh tests/transport-tls.sh kutt-tested pg
          sh tests/transport-tls.sh kutt-tested mysql2
          sh tests/transport-tls.sh kutt-tested redis
      - name: Authenticate to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker tag kutt-tested "ghcr.io/robinmjd/kutt:${VERSION}"
          docker push "ghcr.io/robinmjd/kutt:${VERSION}"
